name: Feature Request
description: Suggest an idea for TeaQuest
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a user pain point?
      placeholder: "Users currently cannot..."

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented
      placeholder: "Add a button that allows users to..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered
      placeholder: "Could also implement..."

  - type: dropdown
    id: area
    attributes:
      label: Area of Application
      description: Which part of TeaQuest does this affect?
      options:
        - E-Commerce (Shop, Cart, Checkout)
        - Tea Codex / Discovery
        - Arcade Games
        - Minecraft Quest
        - The Tavern (Social)
        - User Profile / Progression
        - Admin Dashboard
        - Authentication
        - Performance / Accessibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Low (nice to have)
        - Medium (should have)
        - High (important for users)
        - Critical (blocking release)
      default: 1
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This feature aligns with TeaQuest's vision
          required: true
        - label: I have considered the implementation complexity
          required: true