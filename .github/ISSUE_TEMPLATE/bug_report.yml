name: Bug Report
description: Report a bug to help us improve TeaQuest
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below with as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: What version or commit hash are you running?
      placeholder: "e.g., v1.0.0 or commit abc123"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: What browser and operating system are you using?
      placeholder: "e.g., Chrome 119 on Windows 11"

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click on..."

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "The tea should be added to cart..."

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "Nothing happened / error message..."

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Video
      description: If applicable, add screenshots or a video link
      placeholder: "Drag and drop or paste images here"

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Any error messages from browser console (F12)
      placeholder: "Paste console errors here..."

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have tested this on the latest version
          required: true